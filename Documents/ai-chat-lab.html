<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat Lab</title>
<style>
:root{
 --bg:#0f1218;--panel:#171b24;--soft:#1f2633;--text:#eef2ff;--muted:#97a3bf;--accent:#3b82f6;--ok:#10b981;--err:#ef4444;--border:rgba(255,255,255,.08)
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,system-ui,sans-serif}
.app{display:grid;grid-template-columns:360px 1fr;height:100%}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.mobile-only{display:flex}}
.side{padding:18px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:12px;overflow:auto}
.head{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.code-ish{word-break:break-word}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--soft);color:var(--text);font-size:14px}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px}
.btn{border:0;padding:10px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:var(--err)}
.btn.success{background:var(--ok)}
.small{font-size:12px}
.log{font-size:12px;color:var(--muted);white-space:pre-wrap}
.main{display:flex;flex-direction:column;min-width:0}
.toolbar{padding:16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:90%;padding:12px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#1e3a8a}
.msg.assistant{align-self:flex-start;background:var(--soft);border:1px solid var(--border)}
.msg.system{align-self:center;background:transparent;color:var(--muted);border:1px dashed var(--border)}
.msg.error{align-self:center;background:#3f1212;color:#ffb4b4}
.meta{font-size:11px;color:var(--muted);display:flex;gap:10px;justify-content:space-between}
.inputbar{padding:12px 18px;background:var(--panel);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.inputbar textarea{flex:1;min-height:60px;max-height:220px}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
.hidden{display:none !important}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="app">
 <aside class="side" id="sidebar">
   <div class="head">AI Chat Lab</div>
   <div class="small" id="localStatus">Lưu cấu hình trong localhost/browser storage.</div>
   <div class="field">
     <div class="label">Provider</div>
     <select id="provider">
       <option value="openai">OpenAI (chat completions)</option>
       <option value="anthropic">Anthropic (messages)</option>
     </select>
   </div>
   <div class="field">
     <div class="label">API key</div>
     <input id="apiKey" type="password" placeholder="sk-... / xai-... / ...">
   </div>
   <div class="field">
     <div class="label">Base URL</div>
     <input id="baseUrl" placeholder="https://api.openai.com/v1">
   </div>
   <div class="field">
     <div class="label">Model</div>
     <input id="model" placeholder="gpt-4o / claude-3-5-sonnet-latest">
   </div>
   <div class="field">
     <div class="label">System prompt</div>
     <textarea id="system" rows="4" placeholder="Bạn là assistant…"></textarea>
   </div>
   <div class="field">
     <div class="label">Temperature</div>
     <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7">
   </div>
   <div class="field">
     <div class="label">Max tokens</div>
     <input id="maxTokens" type="number" min="1" max="32768" value="1024">
   </div>
   <div class="row">
     <button class="btn" id="saveBtn">Lưu</button>
     <button class="btn secondary" id="testBtn">Test API</button>
   </div>
   <div class="row">
     <button class="btn secondary" id="exportBtn">Export chat</button>
     <button class="btn danger" id="clearCfgBtn">Xóa config</button>
   </div>
   <div class="small log" id="configLog">Provider]</div>
 </aside>
 <main class="main">
   <header class="toolbar">
     <button class="btn secondary" id="newBtn">Cuộc trò chuyện mới</button>
     <div class="status" id="providerStatus">Idle</div>
   </header>
   <section class="chat" id="chat"></section>
   <footer class="inputbar">
     <textarea id="input" placeholder="Nhập tin nhắn…"></textarea>
     <button class="btn" id="sendBtn">Gửi</button>
   </footer>
 </main>
</div>
<script>
const defaults = {
 openai: {base:'https://api.openai.com/v1', model:'gpt-4o', temp:'0.7'},
 anthropic:{base:'https://api.anthropic.com/v1', model:'claude-3-5-sonnet-latest', temp:'0.7'}
};
const $ = id => document.getElementById(id);
let messages = [];
let busy=false;
function load(){ let r={}; try{r=JSON.parse(localStorage.getItem('aiChatCfg')||'{}')}catch(e){} const p=r.provider||'openai';
 $('provider').value=p; $('apiKey').value=r.apiKey||''; $('baseUrl').value=r.baseUrl||(defaults[p].base); $('model').value=r.model||(defaults[p].model); $('system').value=r.system||''; $('temperature').value=r.temperature||(defaults[p].temp); $('maxTokens').value=r.maxTokens||'1024'; }
function current(){ return {provider:$('provider').value, apiKey:$('apiKey').value.trim(), baseUrl:$('baseUrl').value.trim(), model:$('model').value.trim(), system:$('system').value.trim(), temperature:$('temperature').value.trim(), maxTokens:$('maxTokens').value.trim()}; }
function save(){ const c=current(); localStorage.setItem('aiChatCfg',JSON.stringify(c)); $('configLog').textContent='Đã lưu: '+c.provider+' · '+c.model; }
function providerSwitch(){
 let p=$('provider').value; const d=defaults[p]; if(!$('baseUrl').value.trim()||$('baseUrl').value.trim()===defaults[$('provider').value].base){$('baseUrl').value=d.base;} if(!$('model').value.trim()){$('model').value=d.model;} $('configLog').textContent='Provider: '+p;}
function setMsg(text ){ $('providerStatus').textContent=text; }
function htmlEscape(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function addBubble(kind,text){
 const c=$('chat'); const d=document.createElement('div'); d.className='msg '+kind; d.innerHTML=htmlEscape(text); c.appendChild(d); c.scrollTop=c.scrollHeight; return d;}
function addError(t){addBubble('error','Lỗi: '+t);}
function normalizeBase(b){ return b.replace(/\/+$/,''); }
function messagesForOpenAI(){
 const c=current(); const out=[]; if(c.system) out.push({role:'system',content:c.system});
 for(const m of messages) out.push({role:m.role,content:m.content}); return out;}
function messagesForAnthropic(){ const out=[]; for(const m of messages) out.push({role:m.role,content:m.content}); return out;}

async function callOpenAI(userText,errBubble){
 const c=current(); const url=normalizeBase(c.baseUrl)+'/chat/completions'; const body={model:c.model,messages:messagesForOpenAI().concat([{role:'user',content:userText}]),temperature:Number(c.temperature)}; body.max_tokens = Number(c.maxTokens);
 const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},body:JSON.stringify(body)});
 const raw=await res.text(); let json=null; try{json=JSON.parse(raw)}catch{} if(!res.ok){ throw new Error('HTTP '+res.status+' '+ (json?.error?.message||raw));}
 return {text:json.choices?.[0]?.message?.content||'',tokens:json.usage?.total_tokens};}
async function callAnthropic(userText){
 const c=current(); const url=normalizeBase(c.baseUrl)+'/messages'; const body={model:c.model,max_tokens:Number(c.maxTokens),temperature:Number(c.temperature),messages:messagesForAnthropic().concat([{role:'user',content:userText}]),system:c.system||undefined};
 const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':c.apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify(body)});
 const raw=await res.text(); let json=null; try{json=JSON.parse(raw)}catch{} if(!res.ok){ throw new Error('HTTP '+res.status+' '+(json?.error?.message||raw));}
 return {text:json.content?.map(x=>x.text).join('')||'',tokens:json.usage?.input_tokens+(json.usage?.output_tokens||0)};}

async function send(){
 if(busy) return; const input=$('input'); const userText=input.value.trim();
 if(!userText) return;
 const c=current(); if(!c.apiKey){addError('Thiếu API key.');return;}
 if(!c.baseUrl){addError('Thiếu Base URL.');return;}
 if(!c.model){addError('Thiếu Model.');return;}
 busy=true; input.value=''; addBubble('user',userText); const thinking=addBubble('assistant','Đang trả lời…');
 setMsg('busy');
 try{
   const result = c.provider==='openai' ? await callOpenAI(userText) : await callAnthropic(userText);
   thinking.textContent=result.text||'(no response)'
   messages.push({role:'user',content:userText},{role:'assistant',content:result.text||''});
   const meta=document.createElement('div'); meta.className='small muted'; meta.textContent=result.tokens?'Tokens: '+result.tokens:'';
   thinking.insertAdjacentHTML('afterend','<div class="small muted">OK</div>');
 }catch(e){
   thinking.className='msg error'; thinking.textContent='Lỗi: '+e.message;
   addError(e.message);
 }
 finally{ busy=false; setMsg('idle'); }
}
async function testAPI(){
 const c=current(); if(!c.apiKey){addError('Thiếu API key.');return;}
 const tmp=$('providerStatus'); setMsg('testing');
 addBubble('system','Test kết nối với provider '+c.provider+'…');
 try{
   const p=c.provider==='openai'? await callOpenAI('Reply exactly: OK') : await callAnthropic('Reply exactly: OK');
   addBubble('assistant','TEST OK: '+ (p.text||'').trim() + (p.tokens?' ('+p.tokens+' tokens)':'));
 }catch(e){addError(e.message);}
 finally{setMsg('idle');}
}
function newChat(){ messages=[]; $('chat').innerHTML=''; addBubble('system','Cuộc trò chuyện mới. Ghi chú: API key lưu local trong trình duyệt, chỉ dùng để test.'); }
function exportChat(){ const data=JSON.stringify({provider:current().provider,model:current().model,messages},null,2); const b=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='ai-chat.json'; a.click(); }
function clearCfg(){ localStorage.removeItem('aiChatCfg'); load(); $('configLog').textContent='Đã xóa config.'; }

$('sendBtn').addEventListener('click',send);
$('input').addEventListener('keydown',e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){e.preventDefault();send();}});
$('provider').addEventListener('change',providerSwitch);
$('saveBtn').addEventListener('click',save);
$('testBtn').addEventListener('click',testAPI);
$('newBtn').addEventListener('click',newChat);
$('exportBtn').addEventListener('click',exportChat);
$('clearCfgBtn').addEventListener('click',clearCfg);
load(); newChat();
$('configLog').textContent='Provider: '+current().provider+' · model: '+current().model;
</script>
</body>
</html>
