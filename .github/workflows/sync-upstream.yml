name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch upstream
        run: git remote add upstream https://github.com/owngoal-dev/Apelin.git && git fetch upstream main

      - name: Merge upstream/main
        run: git merge --no-edit upstream/main

      - name: Report conflicts
        if: failure()
        run: |
          echo "::error::Conflicts while merging upstream/main; resolve locally and push."
          git status --short
          exit 1

      - name: Push the merge
        if: success()
        run: |
          git push origin HEAD:main
